[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtai-platform"
version = "0.1.0"
description = "Distributed Task & AI Workflow Orchestration Platform"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
workflow-management = "workflow_engine.management:main"
workflow-llm = "workflow_engine.llm_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
